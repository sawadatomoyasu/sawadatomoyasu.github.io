<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>心理データ解析-IAT</title>
<link rel="stylesheet" href="image_pos.css">

<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background-color: #fafafa;
    text-align: center;
  }

  #imageContainer {
    position: relative;
    width: 800px;
    height: 600px;
    margin: 80px auto 0 auto;
    text-align: center;
    display: none;
    border: none;
  }

  #imageContainer img,
  #imageContainer span.plus,
  #imageContainer span.feedback,
  #imageContainer span.wordStimulus {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
  }

  #imageContainer span.plus {
    font-size: 64px;
    font-weight: bold;
  }

  #imageContainer span.feedback {
    font-size: 80px;
    font-weight: bold;
    color: red;
  }

  #imageContainer span.wordStimulus {
    font-size: 72px;
    font-weight: bold;
    color: #333;
    white-space: nowrap;
  }

  #labels {
    width: 800px;
    margin: 10px auto 0 auto;
    display: flex;
    justify-content: space-between;
    font-size: 60px;
    font-weight: bold;
    color: #333;
    display: none;
  }

  #results {
    margin-top: 50px;
    text-align: center;
    font-size: 20px;
    display: none;
  }

  #waitInstruction,
  #instruction {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 30px;
    font-weight: bold;
    display: none;
    text-align: center;
    width: 1000px;
    line-height: 1.7;
  }

  #studentScreen {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    text-align: center;
  }

  #studentScreen div {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 25px;
  }

  #studentIdInput {
    font-size: 28px;
    padding: 10px;
    width: 300px;
    text-align: center;
  }

  #studentStartButton {
    display: block;
    margin: 25px auto 0 auto;
    font-size: 24px;
    padding: 10px 30px;
    cursor: pointer;
  }

  #studentError {
    margin-top: 15px;
    font-size: 18px;
    color: #b00020;
    display: none;
  }

  table {
    margin: 20px auto;
    border-collapse: collapse;
  }

  th,
  td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
  }
</style>
</head>

<body>

<div id="studentScreen">

  <div>学籍番号を入力してください</div>

  <input
    type="text"
    id="studentIdInput"
    inputmode="numeric"
    autocomplete="off"
  >

  <button id="studentStartButton">
    開始
  </button>

  <div id="studentError">
    学籍番号を数字で入力してください
  </div>

</div>

<div id="waitInstruction"></div>

<div id="instruction"></div>

<div id="experimentBlock">

  <div id="imageContainer"></div>

  <div id="labels">
    <div>快 (F)</div>
    <div>不快 (J)</div>
  </div>

</div>

<div id="results"></div>


<script>

// ========================================================
// Googleフォーム設定
// ========================================================

const GOOGLE_FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSf4dK0Un44FDoxOQbFWQsPS5cqRkmRCf7185aqU3irpJehNaA/formResponse";

let studentId = "";

let studentIsEven = null;

let formSubmitted = false;


// ========================================================
// 快・不快の属性語
//
// 練習：各5語
// 本番：各10語
// ========================================================

const pleasantWords = [
  "幸福",
  "喜び",
  "愛情",
  "希望",
  "笑顔",
  "成功",
  "安心",
  "感謝",
  "快楽",
  "平和"
];

const unpleasantWords = [
  "嫌悪",
  "苦痛",
  "恐怖",
  "憎悪",
  "悲哀",
  "失敗",
  "不安",
  "怒り",
  "苦悩",
  "不幸"
];


// ========================================================
// 本番刺激
//
// 虫10 + 花10 + 快語10 + 不快語10 = 40試行
// ========================================================

const mainStimuli = [];

for(let i = 1; i <= 10; i++) {

  mainStimuli.push({
    type: "insect",
    file: `insects/${i}.jpg`
  });

}

for(let i = 1; i <= 10; i++) {

  mainStimuli.push({
    type: "flower",
    file: `flower/${i}.jpg`
  });

}

pleasantWords.forEach((word) => {

  mainStimuli.push({
    type: "pleasant",
    text: word
  });

});

unpleasantWords.forEach((word) => {

  mainStimuli.push({
    type: "unpleasant",
    text: word
  });

});


// ========================================================
// 練習刺激
//
// 虫5 + 花5 + 快語5 + 不快語5 = 20試行
// ========================================================

const practiceStimuli = [];

for(let i = 1; i <= 5; i++) {

  practiceStimuli.push({
    type: "insect",
    file: `insects_practice/${i}.jpg`
  });

}

for(let i = 1; i <= 5; i++) {

  practiceStimuli.push({
    type: "flower",
    file: `flower_practice/${i}.jpg`
  });

}

pleasantWords.slice(0, 5).forEach((word) => {

  practiceStimuli.push({
    type: "pleasant",
    text: word
  });

});

unpleasantWords.slice(0, 5).forEach((word) => {

  practiceStimuli.push({
    type: "unpleasant",
    text: word
  });

});


// ========================================================
// 状態管理
// ========================================================

let state = "student";

let loopCount = 0;
let maxLoops = 4;
let currentIndex = 0;

let loopStimuli = [];
let rtList = [];
let correctnessList = [];

let allLoopRts = [];
let allLoopStimuli = [];
let allLoopCorrectness = [];

let startTime = 0;


// ========================================================
// 平均反応時間
// ========================================================

let correctMeanRTs = {

  loop2: {
    flower: null,
    insect: null
  },

  loop4: {
    flower: null,
    insect: null
  }

};


// ========================================================
// DOM
// ========================================================

const studentScreen =
  document.getElementById("studentScreen");

const studentIdInput =
  document.getElementById("studentIdInput");

const studentStartButton =
  document.getElementById("studentStartButton");

const studentError =
  document.getElementById("studentError");

const waitDiv =
  document.getElementById("waitInstruction");

const instructionDiv =
  document.getElementById("instruction");

const container =
  document.getElementById("imageContainer");

const labelsDiv =
  document.getElementById("labels");

const resultsDiv =
  document.getElementById("results");


// ========================================================
// シャッフル
// ========================================================

const shuffle = (arr) =>
  arr.sort(() => Math.random() - 0.5);


// ========================================================
// 学籍番号登録
// ========================================================

function registerStudentId() {

  const value =
    studentIdInput.value.trim();


  if(
    value === "" ||
    !/^\d+$/.test(value)
  ) {

    studentError.style.display =
      "block";

    return;
  }


  studentId = value;


  const lastDigit =
    Number(
      studentId.charAt(
        studentId.length - 1
      )
    );


  studentIsEven =
    lastDigit % 2 === 0;


  studentError.style.display =
    "none";


  studentScreen.style.display =
    "none";


  loopCount = 1;


  startLoop(
    loopCount
  );

}


// ========================================================
// 学籍番号入力
// ========================================================

studentStartButton.onclick = () => {

  registerStudentId();

};


studentIdInput.addEventListener(
  "keydown",
  (e) => {

    if(e.key === "Enter") {

      e.preventDefault();

      registerStudentId();

    }

  }
);


// ========================================================
// F / Jキー
// ========================================================

document.addEventListener(
  "keydown",
  (e) => {

    const key =
      e.key.toLowerCase();


    if(
      key !== "f" &&
      key !== "j"
    ) {

      return;

    }


    e.preventDefault();


    switch(state) {

      case "instruction":

        instructionDiv.style.display =
          "none";


        showPlusBeforeStimulus();


        break;


      case "stimulus":

        const rt =
          Date.now() - startTime;


        const correctness =
          checkCorrectness(

            loopCount,

            loopStimuli[
              currentIndex - 1
            ],

            key

          );


        rtList.push(
          rt
        );


        correctnessList.push(
          correctness
        );


        if(
          correctness === "×"
        ) {

          showErrorFeedback();

        }

        else {

          showPlusBeforeStimulus();

        }


        break;

    }

  }
);


// ========================================================
// 正答キー取得
//
// 属性語は全ループ共通
// 快語   → F
// 不快語 → J
//
// 偶数学籍番号
// ループ1・2：虫→F、花→J
// ループ3・4：虫→J、花→F
//
// 奇数学籍番号は逆
// ========================================================

function getCorrectKey(
  loopNumber,
  stimulusType
) {

  if(stimulusType === "pleasant") {

    return "f";

  }


  if(stimulusType === "unpleasant") {

    return "j";

  }


  const firstHalf =
    loopNumber === 1 ||
    loopNumber === 2;


  if(studentIsEven) {

    if(firstHalf) {

      if(stimulusType === "insect") {
        return "f";
      }

      if(stimulusType === "flower") {
        return "j";
      }

    }

    else {

      if(stimulusType === "insect") {
        return "j";
      }

      if(stimulusType === "flower") {
        return "f";
      }

    }

  }

  else {

    if(firstHalf) {

      if(stimulusType === "insect") {
        return "j";
      }

      if(stimulusType === "flower") {
        return "f";
      }

    }

    else {

      if(stimulusType === "insect") {
        return "f";
      }

      if(stimulusType === "flower") {
        return "j";
      }

    }

  }


  return null;
}


// ========================================================
// 条件名取得
// ========================================================

function getConditionLabel(
  loopNumber
) {

  const flowerKey =
    getCorrectKey(
      loopNumber,
      "flower"
    );


  const insectKey =
    getCorrectKey(
      loopNumber,
      "insect"
    );


  const flowerLabel =
    flowerKey === "f"
      ? "快"
      : "不快";


  const insectLabel =
    insectKey === "f"
      ? "快"
      : "不快";


  return `花-${flowerLabel}，虫-${insectLabel}`;
}


// ========================================================
// 正誤判定
// ========================================================

function checkCorrectness(
  loopNumber,
  stimulus,
  keyPressed
) {

  const correctKey =
    getCorrectKey(
      loopNumber,
      stimulus.type
    );


  if(
    keyPressed === correctKey
  ) {

    return "○";

  }


  return "×";
}


// ========================================================
// 誤答フィードバック
// ========================================================

function showErrorFeedback() {

  container.innerHTML =
    "";


  container.style.display =
    "block";


  const feedback =
    document.createElement(
      "span"
    );


  feedback.className =
    "feedback";


  feedback.textContent =
    "×";


  container.appendChild(
    feedback
  );


  state =
    "feedback";


  setTimeout(
    () => {

      showPlusBeforeStimulus();

    },

    700
  );

}


// ========================================================
// 正答試行の平均RT
//
// 採用条件
// ・正答
// ・0.2秒以上
// ・2.0秒以下
//
// 従来通り、Googleフォームへ送る平均RTは
// 花と虫についてのみ算出する
// ========================================================

function calculateCorrectMeanRT(
  loopNumber,
  stimulusType
) {

  const index =
    loopNumber - 1;


  const rts =
    allLoopRts[index];


  const stimuli =
    allLoopStimuli[index];


  const correctness =
    allLoopCorrectness[index];


  const correctRts = [];


  for(
    let i = 0;
    i < stimuli.length;
    i++
  ) {

    if(
      stimuli[i].type === stimulusType &&
      correctness[i] === "○" &&
      rts[i] >= 200 &&
      rts[i] <= 2000
    ) {

      correctRts.push(
        rts[i]
      );

    }

  }


  if(
    correctRts.length === 0
  ) {

    return null;

  }


  const meanMs =

    correctRts.reduce(
      (sum, rt) =>
        sum + rt,
      0
    )

    /
    correctRts.length;


  return meanMs / 1000;
}


// ========================================================
// 4条件の平均RT
// ========================================================

function calculateAllCorrectMeanRTs() {

  correctMeanRTs.loop2.flower =
    calculateCorrectMeanRT(
      2,
      "flower"
    );


  correctMeanRTs.loop2.insect =
    calculateCorrectMeanRT(
      2,
      "insect"
    );


  correctMeanRTs.loop4.flower =
    calculateCorrectMeanRT(
      4,
      "flower"
    );


  correctMeanRTs.loop4.insect =
    calculateCorrectMeanRT(
      4,
      "insect"
    );

}


// ========================================================
// Googleフォーム送信
//
// 送信順を条件ベースで固定
//
// entry.30048019
//   学籍番号
//
// entry.1798634271
//   花-快・虫-不快条件：花RT
//
// entry.1611279218
//   花-快・虫-不快条件：虫RT
//
// entry.126129908
//   花-不快・虫-快条件：花RT
//
// entry.1280501658
//   花-不快・虫-快条件：虫RT
// ========================================================

function sendToGoogleForm() {

  if(
    formSubmitted
  ) {

    return;

  }


  let flowerPleasantInsectUnpleasantFlowerRT;
  let flowerPleasantInsectUnpleasantInsectRT;

  let flowerUnpleasantInsectPleasantFlowerRT;
  let flowerUnpleasantInsectPleasantInsectRT;


  // ======================================================
  // 学籍番号が偶数
  //
  // Loop2
  // 花-不快・虫-快
  //
  // Loop4
  // 花-快・虫-不快
  // ======================================================

  if(studentIsEven) {

    flowerPleasantInsectUnpleasantFlowerRT =
      correctMeanRTs.loop4.flower;

    flowerPleasantInsectUnpleasantInsectRT =
      correctMeanRTs.loop4.insect;


    flowerUnpleasantInsectPleasantFlowerRT =
      correctMeanRTs.loop2.flower;

    flowerUnpleasantInsectPleasantInsectRT =
      correctMeanRTs.loop2.insect;

  }


  // ======================================================
  // 学籍番号が奇数
  //
  // Loop2
  // 花-快・虫-不快
  //
  // Loop4
  // 花-不快・虫-快
  // ======================================================

  else {

    flowerPleasantInsectUnpleasantFlowerRT =
      correctMeanRTs.loop2.flower;

    flowerPleasantInsectUnpleasantInsectRT =
      correctMeanRTs.loop2.insect;


    flowerUnpleasantInsectPleasantFlowerRT =
      correctMeanRTs.loop4.flower;

    flowerUnpleasantInsectPleasantInsectRT =
      correctMeanRTs.loop4.insect;

  }


  const formData =
    new FormData();


  formData.append(
    "entry.30048019",
    studentId
  );


  formData.append(
    "entry.1798634271",

    flowerPleasantInsectUnpleasantFlowerRT === null

      ? ""

      : flowerPleasantInsectUnpleasantFlowerRT
  );


  formData.append(
    "entry.1611279218",

    flowerPleasantInsectUnpleasantInsectRT === null

      ? ""

      : flowerPleasantInsectUnpleasantInsectRT
  );


  formData.append(
    "entry.126129908",

    flowerUnpleasantInsectPleasantFlowerRT === null

      ? ""

      : flowerUnpleasantInsectPleasantFlowerRT
  );


  formData.append(
    "entry.1280501658",

    flowerUnpleasantInsectPleasantInsectRT === null

      ? ""

      : flowerUnpleasantInsectPleasantInsectRT
  );


  fetch(
    GOOGLE_FORM_URL,
    {

      method: "POST",

      mode: "no-cors",

      body: formData

    }
  );


  formSubmitted =
    true;
}


// ========================================================
// ループ開始
// ========================================================

function startLoop(
  loopNumber
) {

  const isPractice =

    loopNumber === 1 ||
    loopNumber === 3;


  loopStimuli =

    isPractice

      ? [...practiceStimuli]

      : [...mainStimuli];


  shuffle(
    loopStimuli
  );


  allLoopStimuli.push(
    [...loopStimuli]
  );


  currentIndex =
    0;


  rtList =
    [];


  correctnessList =
    [];


  showInstruction(
    loopNumber
  );

}


// ========================================================
// 各ループ開始前の教示
// ========================================================

function showInstruction(
  loopNumber
) {

  waitDiv.style.display =
    "none";


  const isPractice =
    loopNumber === 1 ||
    loopNumber === 3;


  const insectKey =
    getCorrectKey(
      loopNumber,
      "insect"
    );


  const flowerKey =
    getCorrectKey(
      loopNumber,
      "flower"
    );


  const insectLabel =
    insectKey === "f"
      ? "快（Fキー）"
      : "不快（Jキー）";


  const flowerLabel =
    flowerKey === "f"
      ? "快（Fキー）"
      : "不快（Jキー）";


  const startText =
    isPractice

      ? "FキーまたはJキーを押すと練習が始まります"

      : "FキーまたはJキーを押すと本番が始まります";


  instructionDiv.innerHTML = `
    両手の人指し指をFキーとJキーにおいてください<br>
    表示された刺激についてFキーまたはJキーをできる限り早く正確に押してください<br><br>

    ・快を表す言葉→快（Fキー）<br>
    ・不快を表す言葉→不快（Jキー）<br>
    ・虫→${insectLabel}<br>
    ・花→${flowerLabel}<br><br>

    ${startText}
  `;


  instructionDiv.style.display =
    "block";


  state =
    "instruction";

}


// ========================================================
// 30秒休憩
// ========================================================

function startRest() {

  container.style.display =
    "none";


  labelsDiv.style.display =
    "none";


  instructionDiv.style.display =
    "none";


  waitDiv.innerHTML =
    "30秒休憩しましょう";


  waitDiv.style.display =
    "block";


  state =
    "rest";


  setTimeout(
    () => {

      waitDiv.style.display =
        "none";


      loopCount++;


      startLoop(
        loopCount
      );

    },

    30000
  );

}


// ========================================================
// 注視点 → 刺激
// ========================================================

function showPlusBeforeStimulus() {


  if(
    currentIndex >=
    loopStimuli.length
  ) {


    allLoopRts.push(
      [...rtList]
    );


    allLoopCorrectness.push(
      [...correctnessList]
    );


    container.style.display =
      "none";


    labelsDiv.style.display =
      "none";


    if(
      loopCount >=
      maxLoops
    ) {

      displayAllResults();

    }

    else {

      startRest();

    }


    return;
  }


  container.innerHTML =
    "";


  container.style.display =
    "block";


  labelsDiv.style.display =
    "flex";


  const plus =
    document.createElement(
      "span"
    );


  plus.className =
    "plus";


  plus.textContent =
    "＋";


  container.appendChild(
    plus
  );


  state =
    "plus";


  setTimeout(
    () => {


      container.innerHTML =
        "";


      const stimulus =
        loopStimuli[
          currentIndex
        ];


      if(
        stimulus.type === "insect" ||
        stimulus.type === "flower"
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          stimulus.file;


        container.appendChild(
          img
        );

      }

      else {

        const word =
          document.createElement(
            "span"
          );


        word.className =
          "wordStimulus";


        word.textContent =
          stimulus.text;


        container.appendChild(
          word
        );

      }


      labelsDiv.style.display =
        "flex";


      startTime =
        Date.now();


      currentIndex++;


      state =
        "stimulus";


    },

    2000
  );

}


// ========================================================
// 結果表示
// ========================================================

function displayAllResults() {


  calculateAllCorrectMeanRTs();


  sendToGoogleForm();


  resultsDiv.style.display =
    "block";


  let html =
    "<h2>反応一覧表</h2>";


  html += `
    <table>
      <tr>
        <th>条件</th>
        <th>刺激</th>
        <th>反応時間（秒）</th>
        <th>正誤</th>
      </tr>
  `;


  for(
    let l = 0;
    l < allLoopRts.length;
    l++
  ) {


    if(
      l + 1 !== 2 &&
      l + 1 !== 4
    ) {

      continue;

    }


    const loopNumber =
      l + 1;


    const conditionLabel =
      getConditionLabel(
        loopNumber
      );


    const rts =
      allLoopRts[l];


    const loopStimuliForResult =
      allLoopStimuli[l];


    const correctness =
      allLoopCorrectness[l];


    for(
      let i = 0;
      i < loopStimuliForResult.length;
      i++
    ) {


      const rtSec =
        (
          rts[i] / 1000
        ).toPrecision(4);


      const stimulus =
        loopStimuliForResult[i];


      const stimulusLabel =

        stimulus.type === "insect"

          ? "虫"

          : stimulus.type === "flower"

          ? "花"

          : stimulus.text;


      html += `
        <tr>
          <td>${conditionLabel}</td>
          <td>${stimulusLabel}</td>
          <td>${rtSec}</td>
          <td>${correctness[i]}</td>
        </tr>
      `;

    }

  }


  html +=
    "</table>";


  resultsDiv.innerHTML =
    html;


  container.style.display =
    "none";


  labelsDiv.style.display =
    "none";


  instructionDiv.style.display =
    "none";


  waitDiv.style.display =
    "none";


  state =
    "finished";

}
