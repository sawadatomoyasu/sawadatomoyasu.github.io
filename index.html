<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>心理データ解析-IAT</title>
<link rel="stylesheet" href="image_pos.css">

<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background-color: #fafafa;
    text-align: center;
  }

  #imageContainer {
    position: relative;
    width: 800px;
    height: 600px;
    margin: 80px auto 0 auto;
    text-align: center;
    display: none;
    border: none;
  }

  #imageContainer img,
  #imageContainer span.plus,
  #imageContainer span.feedback,
  #imageContainer span.wordStimulus {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
  }

  #imageContainer span.plus {
    font-size: 64px;
    font-weight: bold;
  }

  #imageContainer span.feedback {
    font-size: 80px;
    font-weight: bold;
    color: red;
  }

  #imageContainer span.wordStimulus {
    font-size: 72px;
    font-weight: bold;
    color: #333;
    white-space: nowrap;
  }

  #labels {
    width: 800px;
    margin: 10px auto 0 auto;
    display: flex;
    justify-content: space-between;
    font-size: 60px;
    font-weight: bold;
    color: #333;
    display: none;
  }

  #results {
    margin-top: 50px;
    text-align: center;
    font-size: 20px;
    display: none;
  }

  #waitInstruction,
  #instruction {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 30px;
    font-weight: bold;
    display: none;
    text-align: center;
    width: 1000px;
    line-height: 1.7;
  }

  #studentScreen {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    text-align: center;
  }

  #studentScreen div {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 25px;
  }

  #studentIdInput {
    font-size: 28px;
    padding: 10px;
    width: 300px;
    text-align: center;
  }

  #studentStartButton {
    display: block;
    margin: 25px auto 0 auto;
    font-size: 24px;
    padding: 10px 30px;
    cursor: pointer;
  }

  #studentError {
    margin-top: 15px;
    font-size: 18px;
    color: #b00020;
    display: none;
  }

  table {
    margin: 20px auto;
    border-collapse: collapse;
  }

  th,
  td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
  }
</style>
</head>

<body>

<div id="studentScreen">

  <div>学籍番号を入力してください</div>

  <input
    type="text"
    id="studentIdInput"
    inputmode="numeric"
    autocomplete="off"
  >

  <button id="studentStartButton">
    開始
  </button>

  <div id="studentError">
    学籍番号を数字で入力してください
  </div>

</div>

<div id="waitInstruction"></div>

<div id="instruction"></div>

<div id="experimentBlock">

  <div id="imageContainer"></div>

  <div id="labels">
    <div>快 (F)</div>
    <div>不快 (J)</div>
  </div>

</div>

<div id="results"></div>


<script>

// ========================================================
// Googleフォーム設定
// ========================================================

const GOOGLE_FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSf4dK0Un44FDoxOQbFWQsPS5cqRkmRCf7185aqU3irpJehNaA/formResponse";


// Googleフォームの各設問
const FORM_ENTRY_STUDENT_ID =
  "entry.30048019";

const FORM_ENTRY_INSECT_UNPLEASANT_FLOWER_PLEASANT =
  "entry.1798634271";

const FORM_ENTRY_INSECT_PLEASANT_FLOWER_UNPLEASANT =
  "entry.1611279218";

const FORM_ENTRY_IAT_EFFECT =
  "entry.126129908";


let studentId = "";

let studentIsEven = null;

let formSubmitted = false;


// ========================================================
// 快・不快の属性語
//
// 練習：各5語
// 本番：各10語
// ========================================================

const pleasantWords = [
  "幸福",
  "喜び",
  "愛情",
  "希望",
  "笑顔",
  "成功",
  "安心",
  "感謝",
  "快楽",
  "平和"
];

const unpleasantWords = [
  "嫌悪",
  "苦痛",
  "恐怖",
  "憎悪",
  "悲哀",
  "失敗",
  "不安",
  "怒り",
  "苦悩",
  "不幸"
];


// ========================================================
// 本番刺激
//
// 虫10 + 花10 + 快語10 + 不快語10 = 40試行
// ========================================================

const mainStimuli = [];

for(let i = 1; i <= 10; i++) {

  mainStimuli.push({
    type: "insect",
    file: `insects/${i}.jpg`
  });

}

for(let i = 1; i <= 10; i++) {

  mainStimuli.push({
    type: "flower",
    file: `flower/${i}.jpg`
  });

}

pleasantWords.forEach((word) => {

  mainStimuli.push({
    type: "pleasant",
    text: word
  });

});

unpleasantWords.forEach((word) => {

  mainStimuli.push({
    type: "unpleasant",
    text: word
  });

});


// ========================================================
// 練習刺激
//
// 虫5 + 花5 + 快語5 + 不快語5 = 20試行
// ========================================================

const practiceStimuli = [];

for(let i = 1; i <= 5; i++) {

  practiceStimuli.push({
    type: "insect",
    file: `insects_practice/${i}.jpg`
  });

}

for(let i = 1; i <= 5; i++) {

  practiceStimuli.push({
    type: "flower",
    file: `flower_practice/${i}.jpg`
  });

}

pleasantWords.slice(0, 5).forEach((word) => {

  practiceStimuli.push({
    type: "pleasant",
    text: word
  });

});

unpleasantWords.slice(0, 5).forEach((word) => {

  practiceStimuli.push({
    type: "unpleasant",
    text: word
  });

});


// ========================================================
// 状態管理
// ========================================================

let state = "student";

let loopCount = 0;
let maxLoops = 4;
let currentIndex = 0;

let loopStimuli = [];
let rtList = [];
let correctnessList = [];

let allLoopRts = [];
let allLoopStimuli = [];
let allLoopCorrectness = [];

let startTime = 0;


// ========================================================
// 条件別平均RT
//
// 本番ブロック40試行全体の平均
// ・虫
// ・花
// ・快語
// ・不快語
//
// をすべて含む
// ========================================================

let conditionMeanRTs = {

  insectUnpleasantFlowerPleasant: null,

  insectPleasantFlowerUnpleasant: null

};

let iatEffect = null;


// ========================================================
// DOM
// ========================================================

const studentScreen =
  document.getElementById("studentScreen");

const studentIdInput =
  document.getElementById("studentIdInput");

const studentStartButton =
  document.getElementById("studentStartButton");

const studentError =
  document.getElementById("studentError");

const waitDiv =
  document.getElementById("waitInstruction");

const instructionDiv =
  document.getElementById("instruction");

const container =
  document.getElementById("imageContainer");

const labelsDiv =
  document.getElementById("labels");

const resultsDiv =
  document.getElementById("results");


// ========================================================
// シャッフル
// ========================================================

const shuffle = (arr) =>
  arr.sort(() => Math.random() - 0.5);


// ========================================================
// 学籍番号登録
// ========================================================

function registerStudentId() {

  const value =
    studentIdInput.value.trim();


  if(
    value === "" ||
    !/^\d+$/.test(value)
  ) {

    studentError.style.display =
      "block";

    return;
  }


  studentId = value;


  const lastDigit =
    Number(
      studentId.charAt(
        studentId.length - 1
      )
    );


  studentIsEven =
    lastDigit % 2 === 0;


  studentError.style.display =
    "none";


  studentScreen.style.display =
    "none";


  loopCount = 1;


  startLoop(
    loopCount
  );

}


// ========================================================
// 学籍番号入力
// ========================================================

studentStartButton.onclick = () => {

  registerStudentId();

};


studentIdInput.addEventListener(
  "keydown",
  (e) => {

    if(e.key === "Enter") {

      e.preventDefault();

      registerStudentId();

    }

  }
);


// ========================================================
// F / Jキー
// ========================================================

document.addEventListener(
  "keydown",
  (e) => {

    const key =
      e.key.toLowerCase();


    if(
      key !== "f" &&
      key !== "j"
    ) {

      return;

    }


    e.preventDefault();


    switch(state) {

      case "instruction":

        instructionDiv.style.display =
          "none";


        showPlusBeforeStimulus();


        break;


      case "stimulus":

        const rt =
          Date.now() - startTime;


        const correctness =
          checkCorrectness(

            loopCount,

            loopStimuli[
              currentIndex - 1
            ],

            key

          );


        rtList.push(
          rt
        );


        correctnessList.push(
          correctness
        );


        if(
          correctness === "×"
        ) {

          showErrorFeedback();

        }

        else {

          showPlusBeforeStimulus();

        }


        break;

    }

  }
);


// ========================================================
// 正答キー取得
//
// 属性語は全ループ共通
//
// 快語   → F
// 不快語 → J
//
//
// 偶数学籍番号
//
// ループ1・2
//   虫 → 快(F)
//   花 → 不快(J)
//
// ループ3・4
//   虫 → 不快(J)
//   花 → 快(F)
//
//
// 奇数学籍番号は逆
// ========================================================

function getCorrectKey(
  loopNumber,
  stimulusType
) {

  if(stimulusType === "pleasant") {

    return "f";

  }


  if(stimulusType === "unpleasant") {

    return "j";

  }


  const firstHalf =
    loopNumber === 1 ||
    loopNumber === 2;


  if(studentIsEven) {

    if(firstHalf) {

      if(stimulusType === "insect") {
        return "f";
      }

      if(stimulusType === "flower") {
        return "j";
      }

    }

    else {

      if(stimulusType === "insect") {
        return "j";
      }

      if(stimulusType === "flower") {
        return "f";
      }

    }

  }

  else {

    if(firstHalf) {

      if(stimulusType === "insect") {
        return "j";
      }

      if(stimulusType === "flower") {
        return "f";
      }

    }

    else {

      if(stimulusType === "insect") {
        return "f";
      }

      if(stimulusType === "flower") {
        return "j";
      }

    }

  }


  return null;
}


// ========================================================
// 条件名取得
// ========================================================

function getConditionLabel(
  loopNumber
) {

  const flowerKey =
    getCorrectKey(
      loopNumber,
      "flower"
    );


  const insectKey =
    getCorrectKey(
      loopNumber,
      "insect"
    );


  const flowerLabel =
    flowerKey === "f"
      ? "快"
      : "不快";


  const insectLabel =
    insectKey === "f"
      ? "快"
      : "不快";


  return `虫-${insectLabel}，花-${flowerLabel}`;
}


// ========================================================
// 正誤判定
// ========================================================

function checkCorrectness(
  loopNumber,
  stimulus,
  keyPressed
) {

  const correctKey =
    getCorrectKey(
      loopNumber,
      stimulus.type
    );


  if(
    keyPressed === correctKey
  ) {

    return "○";

  }


  return "×";
}


// ========================================================
// 誤答フィードバック
// ========================================================

function showErrorFeedback() {

  container.innerHTML =
    "";


  container.style.display =
    "block";


  const feedback =
    document.createElement(
      "span"
    );


  feedback.className =
    "feedback";


  feedback.textContent =
    "×";


  container.appendChild(
    feedback
  );


  state =
    "feedback";


  setTimeout(
    () => {

      showPlusBeforeStimulus();

    },

    700
  );

}


// ========================================================
// 本番ブロック全体の平均RT
//
// 採用条件
//
// ・正答・誤答をともに含める
// ・0.2秒未満は除外
// ・2.0秒超は除外
//
// したがって
//
//   200 ms <= RT <= 2000 ms
//
// の試行のみ平均する
//
// 虫・花・快語・不快語をすべて含む
// ========================================================

function calculateBlockMeanRT(
  loopNumber
) {

  const index =
    loopNumber - 1;


  const rts =
    allLoopRts[index];


  const selectedRts = [];


  for(
    let i = 0;
    i < rts.length;
    i++
  ) {

    if(
      rts[i] >= 200 &&
      rts[i] <= 2000
    ) {

      selectedRts.push(
        rts[i]
      );

    }

  }


  if(
    selectedRts.length === 0
  ) {

    return null;

  }


  const meanMs =

    selectedRts.reduce(
      (sum, rt) =>
        sum + rt,
      0
    )

    /
    selectedRts.length;


  // 秒単位で返す
  return meanMs / 1000;
}


// ========================================================
// 条件別平均RTとIAT効果を算出
//
// IAT効果
//
// 虫快・花不快条件の平均RT
//   －
// 虫不快・花快条件の平均RT
// ========================================================

function calculateConditionMeanRTs() {

  const loop2Mean =
    calculateBlockMeanRT(
      2
    );


  const loop4Mean =
    calculateBlockMeanRT(
      4
    );


  // ------------------------------------------------------
  // 偶数学籍番号
  //
  // Loop2 = 虫快・花不快
  // Loop4 = 虫不快・花快
  // ------------------------------------------------------

  if(studentIsEven) {

    conditionMeanRTs.insectPleasantFlowerUnpleasant =
      loop2Mean;

    conditionMeanRTs.insectUnpleasantFlowerPleasant =
      loop4Mean;

  }


  // ------------------------------------------------------
  // 奇数学籍番号
  //
  // Loop2 = 虫不快・花快
  // Loop4 = 虫快・花不快
  // ------------------------------------------------------

  else {

    conditionMeanRTs.insectUnpleasantFlowerPleasant =
      loop2Mean;

    conditionMeanRTs.insectPleasantFlowerUnpleasant =
      loop4Mean;

  }


  if(
    conditionMeanRTs.insectPleasantFlowerUnpleasant !== null &&
    conditionMeanRTs.insectUnpleasantFlowerPleasant !== null
  ) {

    iatEffect =

      conditionMeanRTs.insectPleasantFlowerUnpleasant

      -

      conditionMeanRTs.insectUnpleasantFlowerPleasant;

  }

  else {

    iatEffect =
      null;

  }

}


// ========================================================
// Googleフォーム送信
//
// 1. 学籍番号
// 2. 虫不快花快ー平均RT
// 3. 虫快花不快ー平均RT
// 4. IAT効果
//
// IAT効果 =
// 虫快花不快平均RT - 虫不快花快平均RT
// ========================================================

function sendToGoogleForm() {

  if(
    formSubmitted
  ) {

    return;

  }


  const formData =
    new FormData();


  // ------------------------------------------------------
  // 学籍番号
  // ------------------------------------------------------

  formData.append(
    FORM_ENTRY_STUDENT_ID,
    studentId
  );


  // ------------------------------------------------------
  // 虫不快花快ー平均RT
  // ------------------------------------------------------

  formData.append(
    FORM_ENTRY_INSECT_UNPLEASANT_FLOWER_PLEASANT,

    conditionMeanRTs.insectUnpleasantFlowerPleasant === null

      ? ""

      : conditionMeanRTs.insectUnpleasantFlowerPleasant
  );


  // ------------------------------------------------------
  // 虫快花不快ー平均RT
  // ------------------------------------------------------

  formData.append(
    FORM_ENTRY_INSECT_PLEASANT_FLOWER_UNPLEASANT,

    conditionMeanRTs.insectPleasantFlowerUnpleasant === null

      ? ""

      : conditionMeanRTs.insectPleasantFlowerUnpleasant
  );


  // ------------------------------------------------------
  // IAT効果
  //
  // 虫快花不快 - 虫不快花快
  // ------------------------------------------------------

  formData.append(
    FORM_ENTRY_IAT_EFFECT,

    iatEffect === null

      ? ""

      : iatEffect
  );


  fetch(
    GOOGLE_FORM_URL,
    {

      method: "POST",

      mode: "no-cors",

      body: formData

    }
  );


  formSubmitted =
    true;
}


// ========================================================
// ループ開始
// ========================================================

function startLoop(
  loopNumber
) {

  const isPractice =

    loopNumber === 1 ||
    loopNumber === 3;


  loopStimuli =

    isPractice

      ? [...practiceStimuli]

      : [...mainStimuli];


  shuffle(
    loopStimuli
  );


  allLoopStimuli.push(
    [...loopStimuli]
  );


  currentIndex =
    0;


  rtList =
    [];


  correctnessList =
    [];


  showInstruction(
    loopNumber
  );

}


// ========================================================
// 各ループ開始前の教示
// ========================================================

function showInstruction(
  loopNumber
) {

  waitDiv.style.display =
    "none";


  const isPractice =
    loopNumber === 1 ||
    loopNumber === 3;


  const insectKey =
    getCorrectKey(
      loopNumber,
      "insect"
    );


  const flowerKey =
    getCorrectKey(
      loopNumber,
      "flower"
    );


  const insectLabel =
    insectKey === "f"
      ? "快（Fキー）"
      : "不快（Jキー）";


  const flowerLabel =
    flowerKey === "f"
      ? "快（Fキー）"
      : "不快（Jキー）";


  const startText =
    isPractice

      ? "FキーまたはJキーを押すと練習が始まります"

      : "FキーまたはJキーを押すと本番が始まります";


  instructionDiv.innerHTML = `
    両手の人指し指をFキーとJキーにおいてください<br>
    表示された刺激についてFキーまたはJキーをできる限り早く正確に押してください<br><br>

    ・快を表す言葉→快（Fキー）<br>
    ・不快を表す言葉→不快（Jキー）<br>
    ・虫→${insectLabel}<br>
    ・花→${flowerLabel}<br><br>

    ${startText}
  `;


  instructionDiv.style.display =
    "block";


  state =
    "instruction";

}


// ========================================================
// 30秒休憩
// ========================================================

function startRest() {

  container.style.display =
    "none";


  labelsDiv.style.display =
    "none";


  instructionDiv.style.display =
    "none";


  waitDiv.innerHTML =
    "30秒休憩しましょう";


  waitDiv.style.display =
    "block";


  state =
    "rest";


  setTimeout(
    () => {

      waitDiv.style.display =
        "none";


      loopCount++;


      startLoop(
        loopCount
      );

    },

    30000
  );

}


// ========================================================
// 注視点 → 刺激
// ========================================================

function showPlusBeforeStimulus() {


  if(
    currentIndex >=
    loopStimuli.length
  ) {


    allLoopRts.push(
      [...rtList]
    );


    allLoopCorrectness.push(
      [...correctnessList]
    );


    container.style.display =
      "none";


    labelsDiv.style.display =
      "none";


    if(
      loopCount >=
      maxLoops
    ) {

      displayAllResults();

    }

    else {

      startRest();

    }


    return;
  }


  container.innerHTML =
    "";


  container.style.display =
    "block";


  labelsDiv.style.display =
    "flex";


  const plus =
    document.createElement(
      "span"
    );


  plus.className =
    "plus";


  plus.textContent =
    "＋";


  container.appendChild(
    plus
  );


  state =
    "plus";


  setTimeout(
    () => {


      container.innerHTML =
        "";


      const stimulus =
        loopStimuli[
          currentIndex
        ];


      if(
        stimulus.type === "insect" ||
        stimulus.type === "flower"
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          stimulus.file;


        container.appendChild(
          img
        );

      }

      else {

        const word =
          document.createElement(
            "span"
          );


        word.className =
          "wordStimulus";


        word.textContent =
          stimulus.text;


        container.appendChild(
          word
        );

      }


      labelsDiv.style.display =
        "flex";


      startTime =
        Date.now();


      currentIndex++;


      state =
        "stimulus";


    },

    2000
  );

}


// ========================================================
// 結果表示
// ========================================================

function displayAllResults() {


  // 条件別平均RTとIAT効果を計算
  calculateConditionMeanRTs();


  // Googleフォームへ送信
  sendToGoogleForm();


  resultsDiv.style.display =
    "block";


  let html =
    "<h2>反応一覧表</h2>";


  html += `
    <table>
      <tr>
        <th>条件</th>
        <th>刺激</th>
        <th>反応時間（秒）</th>
        <th>正誤</th>
      </tr>
  `;


  for(
    let l = 0;
    l < allLoopRts.length;
    l++
  ) {


    // 本番ブロックのみ表示
    if(
      l + 1 !== 2 &&
      l + 1 !== 4
    ) {

      continue;

    }


    const loopNumber =
      l + 1;


    const conditionLabel =
      getConditionLabel(
        loopNumber
      );


    const rts =
      allLoopRts[l];


    const loopStimuliForResult =
      allLoopStimuli[l];


    const correctness =
      allLoopCorrectness[l];


    for(
      let i = 0;
      i < loopStimuliForResult.length;
      i++
    ) {


      const rtSec =
        (
          rts[i] / 1000
        ).toPrecision(4);


      const stimulus =
        loopStimuliForResult[i];


      const stimulusLabel =

        stimulus.type === "insect"

          ? "虫"

          : stimulus.type === "flower"

          ? "花"

          : stimulus.text;


      html += `
        <tr>
          <td>${conditionLabel}</td>
          <td>${stimulusLabel}</td>
          <td>${rtSec}</td>
          <td>${correctness[i]}</td>
        </tr>
      `;

    }

  }


  html +=
    "</table>";


  // ------------------------------------------------------
  // 条件平均RTとIAT効果も画面下部に表示
  // ------------------------------------------------------

  html += `
    <h2>集計結果</h2>

    <table>
      <tr>
        <th>指標</th>
        <th>値（秒）</th>
      </tr>

      <tr>
        <td>虫不快・花快 平均RT</td>
        <td>${
          conditionMeanRTs.insectUnpleasantFlowerPleasant === null
            ? ""
            : conditionMeanRTs.insectUnpleasantFlowerPleasant.toFixed(4)
        }</td>
      </tr>

      <tr>
        <td>虫快・花不快 平均RT</td>
        <td>${
          conditionMeanRTs.insectPleasantFlowerUnpleasant === null
            ? ""
            : conditionMeanRTs.insectPleasantFlowerUnpleasant.toFixed(4)
        }</td>
      </tr>

      <tr>
        <td>IAT効果</td>
        <td>${
          iatEffect === null
            ? ""
            : iatEffect.toFixed(4)
        }</td>
      </tr>

    </table>
  `;


  resultsDiv.innerHTML =
    html;


  container.style.display =
    "none";


  labelsDiv.style.display =
    "none";


  instructionDiv.style.display =
    "none";


  waitDiv.style.display =
    "none";


  state =
    "finished";

}

</script>

</body>
</html>
